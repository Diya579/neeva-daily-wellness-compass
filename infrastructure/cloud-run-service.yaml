# ============================================================================
# Google Cloud Run Service Specification (Knative v1)
# Region: asia-south1 (Mumbai)
# Operational Database: Firebase Cloud Firestore (Native Mode)
# ============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: neeva-api
  labels:
    cloud.googleapis.com/location: asia-south1
    app: neeva-ai-backend
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: neeva-api-sa@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 120
      containers:
        - name: neeva-api
          image: asia-south1-docker.pkg.dev/PROJECT_ID/neeva-backend/neeva-api:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: FIREBASE_PROJECT_ID
              value: "PROJECT_ID"
            - name: ENVIRONMENT
              value: "production"
            - name: FIRESTORE_REQUIRE_LIVE
              value: "true"
            - name: FIREBASE_APP_CHECK_ENFORCE
              value: "true"
            - name: DLP_REGION
              value: "asia-south1"
            - name: VERTEX_AI_REGION
              value: "asia-south1"
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neeva-gemini-api-key
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
