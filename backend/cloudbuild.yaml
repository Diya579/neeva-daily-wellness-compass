# ============================================================================
# Google Cloud Build — Neeva AI Backend CI/CD Pipeline
# Operational Database: Firebase Cloud Firestore (Native Mode)
# Builds container image, pushes to Google Artifact Registry, deploys to Cloud Run
# ============================================================================

substitutions:
  _REGION: asia-south1
  _AR_REPO: neeva-backend
  _SERVICE_NAME: neeva-api
  _SERVICE_ACCOUNT: neeva-api-sa@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  # 1. Run backend automated test suite
  - name: 'python:3.11-slim'
    id: 'test'
    dir: 'backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir -r requirements.txt
        pytest -q

  # 2. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # 3. Push image to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}'

  # 4. Deploy to Google Cloud Run (Mumbai asia-south1) connected to Cloud Firestore
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIREBASE_PROJECT_ID=${PROJECT_ID},ENVIRONMENT=production,FIRESTORE_REQUIRE_LIVE=true,DLP_REGION=${_REGION},VERTEX_AI_REGION=${_REGION}'
      - '--set-secrets=GEMINI_API_KEY=neeva-gemini-api-key:latest'
      - '--min-instances=1'
      - '--max-instances=20'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--concurrency=80'
      - '--no-allow-unauthenticated'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
