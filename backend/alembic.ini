# Alembic configuration file — https://alembic.sqlalchemy.org/

[alembic]
# Path to the migration scripts folder (relative to this file's location).
script_location = migrations

# The database URL.  In practice this is overridden at runtime by the
# DATABASE_URL environment variable read in env.py; the placeholder below
# keeps Alembic happy when the env-var is not set.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost/neeva_ai

# Template used for revision file names.
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps.
timezone = UTC

[post_write_hooks]
# No post-write hooks configured by default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
